name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private signing key
        env:
          KEYSTORE: ${{ secrets.POCKET_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure repository signing secrets first'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pocket-release.jks"
      - name: Test and build signed APK
        env:
          POCKET_KEYSTORE: ${{ runner.temp }}/pocket-release.jks
          POCKET_KEYSTORE_PASSWORD: ${{ secrets.POCKET_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk pocket-live.apk
          sha256sum pocket-live.apk > pocket-live.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-live-apk
          path: |
            pocket-live.apk
            pocket-live.apk.sha256
          retention-days: 30
      - name: Attach APK to private release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" pocket-live.apk pocket-live.apk.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" pocket-live.apk pocket-live.apk.sha256 --title "${GITHUB_REF_NAME}" --generate-notes --prerelease
          fi
