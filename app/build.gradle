plugins { id 'com.android.application' }
android {
    namespace 'cn.eveonecat.pocket'
    compileSdk 35
    defaultConfig { applicationId 'cn.eveonecat.pocket'; minSdk 30; targetSdk 35; versionCode 4; versionName '0.1.3' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('POCKET_KEYSTORE')) {
                storeFile file(System.getenv('POCKET_KEYSTORE'))
                storePassword System.getenv('POCKET_KEYSTORE_PASSWORD')
                keyAlias 'pocket'
                keyPassword System.getenv('POCKET_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
